[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "titles"
dynamic = ["version", "description"]
authors = [{name = "hyperimpose.org", email = "hyperimpose@protonmail.com"}]
requires-python = ">=3.11"
license = {file = "COPYING"}
keywords = ["titles", "hyperimpose", "url", "api", "metadata", "link", "title", "website", "http"]
classifiers = [
            "Development Status :: 4 - Beta",
            "Intended Audience :: Developers",
            "License :: OSI Approved :: GNU Affero General Public License v3",
            "Topic :: Communications :: Chat",
            "Topic :: Internet",
            "Topic :: Internet :: WWW/HTTP"
]
dependencies = [
             "async_lru",
             "html5lib",
             "imagesize",
             "msgspec",
             "niquests",
             "starlette",
             "uvicorn[standard]"
]

[project.optional-dependencies]
dev = [
    "flake8",
    "mypy",
    "pylsp-mypy",
    "python-lsp-server[all]",
    "types-html5lib",
    "types-Pillow"
]
browser = [
        "playwright"
]
media = [
      "pymediainfo",
      "PyMuPDF",
      "pillow"
]
explicit = [
         "huggingface_hub",
         "numpy",
         "onnxruntime",
         "pillow"
]

[project.urls]
Home = "https://github.com/hyperimpose/titles"
Source = "https://github.com/hyperimpose/titles"
